name: apple1js

services:
  dev:
    build:
      context: .
      target: dev
      args:
        NODE_VERSION: "22.16.0"
    ports:
      - "3000:3000"
    volumes:
      # Source code from host (fast iteration)
      - .:/app:cached

      # Keep dependencies inside Docker, not on your host FS.
      - node_modules:/app/node_modules
      - yarn_cache:/usr/local/share/.cache/yarn
    environment:
      # Vite file watching can be flaky inside Docker on macOS; polling is the most reliable.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NODE_ENV: development
    command: >
      sh -lc "yarn install --frozen-lockfile && yarn dev --host 0.0.0.0 --port 3000 --strictPort --open false"

  # Creates a production image and serves the built static app with nginx.
  prod:
    build:
      context: .
      target: prod
      args:
        NODE_VERSION: "22.16.0"
    ports:
      - "8080:80"
    restart: unless-stopped

  # Convenience tool container to generate ./dist on the host.
  build:
    profiles: ["tools"]
    build:
      context: .
      target: deps
      args:
        NODE_VERSION: "22.16.0"
    volumes:
      - .:/app:cached
      - node_modules:/app/node_modules
      - yarn_cache:/usr/local/share/.cache/yarn
    working_dir: /app
    command: >
      sh -lc "yarn install --frozen-lockfile && yarn build"

volumes:
  node_modules:
  yarn_cache: