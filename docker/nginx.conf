server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite builds a SPA; this keeps client-side routing working.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic static caching (safe default for hashed Vite assets).
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }
}
